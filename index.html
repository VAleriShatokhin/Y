      margin: 0;
      font: inherit;
      color: currentColor;
      width: 1.25em;
      height: 1.25em;

      display: grid;
      place-content: center;
      cursor: pointer;

      content: "";
      width: 0.65em;
      height: 0.65em;
      transform: scale(0);
      transition: 120ms transform ease-in-out;
      box-shadow: inset 1em 1em white;
      background-color: transform;
      transform-origin: bottom left;
      clip-path: polygon(14% 44%, 0 65%, 50% 100%, 100% 16%, 80% 0%, 43% 62%);

    function useLocalStorage(key, initialValue) {
      const [storedValue, setStoredValue] = useState(() => {
        try {
          const item = window.localStorage.getItem(key);
          return item ? JSON.parse(item) : initialValue;
        } catch (error) {
          return initialValue;
        }
      });
      const setValue = value => {
        try {
          const valueToStore = value instanceof Function ? value(storedValue) : value;
          setStoredValue(valueToStore);
          window.localStorage.setItem(key, JSON.stringify(valueToStore));
        } catch (error) {}
      };
      return [storedValue, setValue];
    }

    const formatDate = (date) => {
      return date.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    };

    const formatIcsDate = (date, hourOffset = 0) => {
      const d = new Date(date);
      d.setHours(9 + hourOffset, 0, 0, 0);
      return d.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
    };

      const getDayDate = (dayNumber) => {
        const d = new Date(userData.startDate);
        d.setDate(d.getDate() + (dayNumber - 1));
        return d;
      };

      const generateIcsFile = (daysArray, filename = 'plan.ics') => {
        let ics = "BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//NavigatorRazvitiya//RU\r\nCALSCALE:GREGORIAN\r\n";
        
        daysArray.forEach(day => {
          const dDate = getDayDate(day.day);
          const dtStart = formatIcsDate(dDate, 0);
          const dtEnd = formatIcsDate(dDate, 1);
          
          ics += "BEGIN:VEVENT\r\n";
          ics += `UID:day${day.day}-${Date.now()}@navigator\r\n`;
          ics += `DTSTAMP:${formatIcsDate(new Date())}\r\n`;
          ics += `DTSTART:${dtStart}\r\n`;
          ics += `DTEND:${dtEnd}\r\n`;
          ics += `SUMMARY:День ${day.day}: ${day.title}\r\n`;
          ics += `DESCRIPTION:Речь: ${day.tasks.speech}\\nЛогика: ${day.tasks.logic}\\nСамоконтроль: ${day.tasks.control}\\nПитание: ${day.tasks.diet}\r\n`;
          ics += "END:VEVENT\r\n";
        });
        
        ics += "END:VCALENDAR";
        
        const blob = new Blob([ics], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      const toggleTask = (day, category) => {
        setProgress(prev => ({ ...prev, [day]: { ...prev[day], [category]: !prev[day]?.[category] } }));
      };

      const updateObservation = (day, field, value) => {
        setProgress(prev => ({ ...prev, [day]: { ...prev[day], [field]: value } }));
      };

      const markAllDay = (day) => {
        setProgress(prev => ({ ...prev, [day]: { ...prev[day], speech: true, logic: true, control: true, diet: true } }));
      };

      const handleExportJson = () => {
        const dataStr = JSON.stringify({ userData, progress });
        const dataUri = 'data:application/json;charset=utf-8,'+ encodeURIComponent(dataStr);
        const link = document.createElement('a');
        link.setAttribute('href', dataUri);
        link.setAttribute('download', 'navigator_backup.json');
        link.click();
      };

      const handleImportJson = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const obj = JSON.parse(event.target.result);
            if (obj.userData) setUserData(obj.userData);
            if (obj.progress) setProgress(obj.progress);
            showToast('Данные успешно загружены!');
          } catch (err) { showToast('Ошибка чтения файла.'); }
        };
        reader.readAsText(file);
      };

      const stats = useMemo(() => {
        let completedDays = 0, counts = { speech: 0, logic: 0, control: 0, diet: 0 };
        PLAN_DATA.forEach(d => {
          const p = progress[d.day] || {};
          if (p.speech) counts.speech++;
          if (p.logic) counts.logic++;
          if (p.control) counts.control++;
          if (p.diet) counts.diet++;
          if (p.speech && p.logic && p.control && p.diet) completedDays++;
        });
        const totalTasks = counts.speech + counts.logic + counts.control + counts.diet;
        return {
          completedDays,
          totalPercent: Math.round((totalTasks / 120) * 100) || 0,
          speechPercent: Math.round((counts.speech / 30) * 100) || 0,
          logicPercent: Math.round((counts.logic / 30) * 100) || 0,
          controlPercent: Math.round((counts.control / 30) * 100) || 0,
          dietPercent: Math.round((counts.diet / 30) * 100) || 0,
        };
      }, [progress]);

      const filteredDays = useMemo(() => {
        return PLAN_DATA.filter(day => {
          if (currentWeek !== 'all') {
            const startDay = (currentWeek - 1) * 7 + 1;
            const endDay = currentWeek * 7;
            if (day.day < startDay || day.day > endDay) return false;
          }
          if (searchQuery) {
            const query = searchQuery.toLowerCase();
            return `${day.title} ${day.tasks.speech} ${day.tasks.logic} ${day.tasks.control} ${day.tasks.diet}`.toLowerCase().includes(query);
          }
          return true;
        });
      }, [currentWeek, searchQuery]);

      return (
        <div className="min-h-screen pb-10">
          {/* Header */}
          <header className="bg-white border-b border-slate-200 sticky top-0 z-10 no-print">
            <div className="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center">
              <div className="flex gap-3 items-center">
                <div className="bg-indigo-600 text-white p-2 rounded-xl"><IconCalendar /></div>
                <div>
                  <h1 className="font-bold text-lg leading-tight">Навигатор Развития 5+</h1>
                  <p className="text-xs text-slate-500">Профиль: {userData.childName}</p>
                </div>
              </div>
              <div className="flex gap-2">
                <button onClick={() => window.print()} className="p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><IconPrint /></button>
                <button onClick={() => setShowSettings(!showSettings)} className="p-2 text-slate-500 hover:bg-slate-100 rounded-lg"><IconSettings /></button>
              </div>
            </div>

            {/* Settings Panel */}
            {showSettings && (
              <div className="max-w-5xl mx-auto px-4 py-4 bg-slate-50 border-b border-slate-200 grid md:grid-cols-2 gap-6">
                <div className="space-y-4">
                  <div>
                    <label className="block text-sm mb-1">Имя ребёнка</label>
                    <input type="text" value={userData.childName} onChange={e => setUserData({...userData, childName: e.target.value})} className="w-full p-2 border rounded-lg" />
                  </div>
                  <div>
                    <label className="block text-sm mb-1">Дата старта (День 1)</label>
                    <input type="date" value={userData.startDate} onChange={e => setUserData({...userData, startDate: e.target.value})} className="w-full p-2 border rounded-lg" />
                  </div>
                </div>
                <div className="space-y-4">
                  <div className="text-sm font-medium mb-1">Управление данными</div>
                  <div className="flex gap-2">
                    <button onClick={handleExportJson} className="flex gap-2 bg-white border px-3 py-2 rounded-lg text-sm"><IconDownload /> Резервная копия</button>
                    <label className="flex gap-2 bg-white border px-3 py-2 rounded-lg text-sm cursor-pointer"><IconUpload /> Загрузить
                      <input type="file" accept=".json" onChange={handleImportJson} className="hidden" />
                    </label>
                  </div>
                  <button onClick={() => generateIcsFile(PLAN_DATA, 'navigator_plan_all.ics')} className="flex gap-2 bg-indigo-50 text-indigo-700 border border-indigo-200 px-3 py-2 rounded-lg text-sm w-full justify-center hover:bg-indigo-100 transition">
                    <IconCalendar /> Выгрузить весь план в Календарь (Универсальный файл)
                  </button>
                </div>
              </div>
            )}
          </header>

          <main className="max-w-5xl mx-auto px-4 py-6">
            {/* Stats */}
            <section className="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 mb-8 grid md:grid-cols-3 gap-6 items-center">
              <div className="flex items-center gap-4 border-b md:border-b-0 md:border-r border-slate-100 pb-4 md:pb-0">
                <div className="relative w-20 h-20">
                  <svg className="w-full h-full -rotate-90" viewBox="0 0 36 36">
                    <path className="text-slate-100" strokeWidth="3" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                    <path className="text-indigo-600 transition-all duration-1000" strokeDasharray={`${stats.totalPercent}, 100`} strokeWidth="3" strokeLinecap="round" stroke="currentColor" fill="none" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" />
                  </svg>
                  <div className="absolute inset-0 flex items-center justify-center font-bold text-lg text-indigo-900">{stats.totalPercent}%</div>
                </div>
                <div>
                  <h2 className="text-lg font-bold">Прогресс</h2>
                  <p className="text-sm text-slate-500">Завершено дней: <b>{stats.completedDays}</b> / 30</p>
                </div>
              </div>
              <div className="md:col-span-2 grid grid-cols-2 sm:grid-cols-4 gap-4">
                {[['Речь', stats.speechPercent, 'bg-blue-500'], ['Логика', stats.logicPercent, 'bg-purple-500'], ['Контроль', stats.controlPercent, 'bg-green-500'], ['Еда', stats.dietPercent, 'bg-orange-500']].map(([label, pct, bg]) => (
                  <div key={label}>
                    <div className="flex justify-between text-xs mb-1"><span className="text-slate-500">{label}</span><span className="font-bold">{pct}%</span></div>
                    <div className="h-2 w-full bg-slate-100 rounded-full"><div className={`h-full ${bg} rounded-full`} style={{ width: `${pct}%` }}></div></div>
                  </div>
                ))}
              </div>
            </section>

            {/* Filters */}
            <div className="flex flex-col sm:flex-row justify-between gap-4 mb-6 no-print">
              <div className="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
                {['all', 1, 2, 3, 4, 5].map(w => (
                  <button key={w} onClick={() => setCurrentWeek(w)} className={`whitespace-nowrap px-4 py-2 rounded-xl text-sm font-medium ${currentWeek === w ? 'bg-slate-800 text-white' : 'bg-white border text-slate-600'}`}>
                    {w === 'all' ? 'Все дни' : w === 5 ? 'Финал' : `Неделя ${w}`}
                  </button>
                ))}
              </div>
              <div className="flex gap-2 relative">
                <div className="absolute left-3 top-2.5 text-slate-400"><IconSearch /></div>
                <input type="text" placeholder="Поиск..." value={searchQuery} onChange={e => setSearchQuery(e.target.value)} className="w-full sm:w-48 pl-10 pr-3 py-2 border rounded-xl text-sm" />
                <button onClick={() => setExpandedDays(Object.fromEntries(PLAN_DATA.map(d => [d.day, true])))} className="p-2 border rounded-xl text-slate-500"><IconChevronDown /></button>
                <button onClick={() => setExpandedDays({})} className="p-2 border rounded-xl text-slate-500"><IconChevronUp /></button>
              </div>
            </div>

            {/* List */}
            <div className="grid gap-4">
              {filteredDays.map(dayData => {
                const isExp = expandedDays[dayData.day];
                const p = progress[dayData.day] || {};
                const isDone = p.speech && p.logic && p.control && p.diet;
                
                return (
                  <div key={dayData.day} className={`print-card bg-white rounded-2xl border ${isDone ? 'border-indigo-200 bg-indigo-50/20' : 'border-slate-200'} overflow-hidden`}>
                    {/* Card Header */}
                    <div className="px-5 py-4 cursor-pointer flex justify-between items-center hover:bg-slate-50" onClick={() => setExpandedDays(prev => ({...prev, [dayData.day]: !prev[dayData.day]}))}>
                      <div className="flex gap-4 items-center">
                        <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold ${isDone ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-500'}`}>
                          {isDone ? <IconCheckCircle /> : dayData.day}
                        </div>
                        <div>
                          <h3 className="font-bold text-slate-800">{dayData.title}</h3>
                          <p className="text-sm text-slate-500">{formatDate(getDayDate(dayData.day))}</p>
                        </div>
                      </div>
                      <div className="flex gap-3 text-slate-400 no-print">
                        <div className="hidden sm:flex gap-1.5 items-center">
                          <div className={`w-2.5 h-2.5 rounded-full ${p.speech ? 'bg-blue-500' : 'bg-slate-200'}`} />
                          <div className={`w-2.5 h-2.5 rounded-full ${p.logic ? 'bg-purple-500' : 'bg-slate-200'}`} />
                          <div className={`w-2.5 h-2.5 rounded-full ${p.control ? 'bg-green-500' : 'bg-slate-200'}`} />
                          <div className={`w-2.5 h-2.5 rounded-full ${p.diet ? 'bg-orange-500' : 'bg-slate-200'}`} />
                        </div>
                        {isExp ? <IconChevronUp /> : <IconChevronDown />}
                      </div>
                    </div>

                    {isExp && (
                      <div className="px-5 pb-5 pt-2 border-t border-slate-100">
                        <div className="grid md:grid-cols-2 gap-8">
                          
                          {/* Tasks */}
                          <div className="space-y-3">
                            {[
                              ['speech', 'Речь и кругозор', 'text-blue-700 bg-blue-50 border-blue-200 checkbox-blue'],
                              ['logic', 'Логика и память', 'text-purple-700 bg-purple-50 border-purple-200 checkbox-purple'],
                              ['control', 'Самоконтроль', 'text-green-700 bg-green-50 border-green-200 checkbox-green'],
                              ['diet', 'Питание', 'text-orange-700 bg-orange-50 border-orange-200 checkbox-orange']
                            ].map(([cat, label, style]) => {
                              return (
                                <div key={cat} className={`flex gap-3 p-3 rounded-xl border ${p[cat] ? 'opacity-70 bg-slate-50 border-slate-200' : style}`}>
                                  <input id={`t-${dayData.day}-${cat}`} type="checkbox" checked={!!p[cat]} onChange={() => toggleTask(dayData.day, cat)} className={`mt-0.5 ${style.split(' ').pop()}`} />
                                  <div className="flex-1">
                                    <div className="flex justify-between items-start mb-0.5">
                                      <label htmlFor={`t-${dayData.day}-${cat}`} className={`text-xs font-bold uppercase tracking-wider cursor-pointer ${p[cat]?'text-slate-400':''}`}>{label}</label>
                                    </div>
                                    <label htmlFor={`t-${dayData.day}-${cat}`} className={`text-sm cursor-pointer block ${p[cat]?'text-slate-500 line-through':'text-slate-800'}`}>{dayData.tasks[cat]}</label>
                                  </div>
                                </div>
                              );
                            })}
                          </div>

                          {/* Notes */}
                          <div className="bg-slate-50 rounded-xl p-4 border border-slate-200 flex flex-col">
                            <h4 className="font-semibold text-sm mb-3">Дневник наблюдений</h4>
                            <div className="flex gap-4 mb-3">
                              <div>
                                <span className="text-xs text-slate-500 block mb-1">Настроение:</span>
                                <div className="flex gap-1 bg-white p-1 rounded-lg border w-max text-lg">
                                  <button onClick={(e) => {e.stopPropagation(); updateObservation(dayData.day, 'mood', 'good')}} className={`p-1 rounded ${p.mood==='good'?'bg-green-100 opacity-100':'opacity-50 grayscale'}`}>😊</button>
                                  <button onClick={(e) => {e.stopPropagation(); updateObservation(dayData.day, 'mood', 'neutral')}} className={`p-1 rounded ${p.mood==='neutral'?'bg-amber-100 opacity-100':'opacity-50 grayscale'}`}>😐</button>
                                  <button onClick={(e) => {e.stopPropagation(); updateObservation(dayData.day, 'mood', 'bad')}} className={`p-1 rounded ${p.mood==='bad'?'bg-red-100 opacity-100':'opacity-50 grayscale'}`}>☹️</button>
                                </div>
                              </div>
                              <div>
                                <span className="text-xs text-slate-500 block mb-1">Энергия:</span>
                                <div className="flex gap-1 bg-white p-1 rounded-lg border w-max text-lg">
                                  <button onClick={(e) => {e.stopPropagation(); updateObservation(dayData.day, 'energy', 'high')}} className={`p-1 rounded ${p.energy==='high'?'bg-emerald-100 opacity-100':'opacity-50 grayscale'}`}>⚡</button>
                                  <button onClick={(e) => {e.stopPropagation(); updateObservation(dayData.day, 'energy', 'med')}} className={`p-1 rounded ${p.energy==='med'?'bg-blue-100 opacity-100':'opacity-50 grayscale'}`}>🔋</button>
                                  <button onClick={(e) => {e.stopPropagation(); updateObservation(dayData.day, 'energy', 'low')}} className={`p-1 rounded ${p.energy==='low'?'bg-slate-200 opacity-100':'opacity-50 grayscale'}`}>🪫</button>
                                </div>
                              </div>
                            </div>
                            
                            <textarea 
                              className="w-full flex-1 p-3 rounded-lg border text-sm resize-none" 
                              placeholder="Что далось легко, а где нужна была помощь?"
                              value={p.notes || ''} onChange={(e) => updateObservation(dayData.day, 'notes', e.target.value)}
                            />
                          </div>
                        </div>

                        {/* Card Footer Actions */}
                        <div className="mt-5 pt-4 border-t border-slate-100 flex flex-wrap justify-between gap-3 no-print">
                          <button onClick={() => markAllDay(dayData.day)} className="text-sm font-medium text-indigo-600 hover:bg-indigo-50 px-2 py-1 rounded transition">✓ Отметить всё</button>
                          <div className="flex gap-2">
                            <button onClick={() => { 
                              navigator.clipboard.writeText(`День ${dayData.day}: ${dayData.title}\nРечь: ${dayData.tasks.speech}\nЛогика: ${dayData.tasks.logic}\nКонтроль: ${dayData.tasks.control}\nПитание: ${dayData.tasks.diet}`);
                              showToast("Текст заданий скопирован!"); 
                            }} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium bg-slate-100 rounded-lg hover:bg-slate-200 transition"><IconShare /> Текст</button>
                            
                            <button onClick={() => {
                              generateIcsFile([dayData], `day${dayData.day}.ics`);
                              showToast("Календарь скачан!");
                            }} className="flex items-center gap-1.5 px-3 py-1.5 text-xs font-medium text-slate-700 bg-slate-50 border rounded-lg hover:bg-slate-100 transition"><IconCalendar /> В Календарь</button>
                          </div>
                        </div>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          </main>
          
          {/* Toast Notification Element */}
          {toastMessage && (
            <div className="fixed bottom-6 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-5 py-3 rounded-full shadow-xl z-50 text-sm font-medium animate-toast no-print pointer-events-none">
              {toastMessage}
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
